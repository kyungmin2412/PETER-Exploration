<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페테르 탐방</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    :root {
      --green: #78b82a;
      --green-dark: #4f8616;
      --green-light: #eff9df;
      --text: #191f28;
      --sub-text: #6b7684;
      --muted: #8b95a1;
      --background: #f6faef;
      --border: #e1ebd5;
      --white: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--background);
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; background: transparent; }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: 70px;
      padding: 0 max(24px, calc((100vw - 1160px) / 2));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(15px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .logo-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
      font-size: 16px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 7px 11px;
      border-radius: 20px;
      background: var(--background);
      color: var(--sub-text);
      font-size: 12px;
      font-weight: 600;
    }

    .gcal-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 20px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: 0.15s;
    }
    .gcal-button:hover { background: #e2f2c6; }

    .setup-copy { margin: 0 0 20px; color: var(--sub-text); font-size: 14px; line-height: 1.6; }

    .copy-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .copy-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--sub-text);
      background: var(--background);
    }
    .copy-row button {
      padding: 0 16px;
      border-radius: 11px;
      color: white;
      background: var(--green);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }
    .copy-row button:hover { background: var(--green-dark); }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .sync-status.online .sync-dot { background: var(--green); }
    .sync-status.syncing .sync-dot { background: #f5a623; }
    .sync-status.offline .sync-dot { background: #f04452; }

    .main-content {
      display: grid;
      grid-template-columns: minmax(600px, 1.8fr) minmax(320px, 0.9fr);
      gap: 22px;
      max-width: 1160px;
      margin: 0 auto 100px;
      padding: 40px 20px 0;
    }

    .calendar-card, .detail-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(55, 86, 18, 0.08);
      min-width: 0;
    }

    .calendar-card { padding: 30px; }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .search-row { margin-bottom: 18px; }
    .search-row input {
      width: 100%;
      height: 46px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--background);
      outline: none;
    }
    .search-row input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); background: white; }

    .search-results { display: grid; gap: 10px; }
    .search-results[hidden] { display: none; }
    .search-results-count { margin: 0 0 4px; color: var(--muted); font-size: 12px; }

    .search-result-item {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfef9;
      transition: 0.15s;
    }
    .search-result-item:hover { border-color: #a9cf75; }
    .search-result-main h3 { margin: 0 0 5px; font-size: 16px; letter-spacing: -0.4px; }
    .search-result-main p { margin: 0; color: var(--sub-text); font-size: 12px; }
    .search-result-date {
      flex: none;
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .company-group { display: grid; gap: 8px; margin-bottom: 14px; }
    .company-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--green-light);
    }
    .company-group-name { font-weight: 800; color: var(--green-dark); font-size: 15px; }
    .company-group-badge { font-size: 12px; color: var(--green-dark); font-weight: 700; white-space: nowrap; }

    .link-list { display: grid; gap: 8px; margin-top: 16px; }
    .link-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fcfef9;
    }
    .link-list-item a {
      min-width: 0;
      overflow: hidden;
      color: var(--green-dark);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-list-item a:hover { text-decoration: underline; }

    .link-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .link-chip {
      display: inline-flex;
      align-items: center;
      max-width: 170px;
      padding: 5px 9px;
      border-radius: 8px;
      overflow: hidden;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-chip:hover { background: #e2f2c6; }

    .link-add-button {
      flex: none;
      padding: 5px 9px;
      border-radius: 8px;
      color: var(--sub-text);
      background: var(--background);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .link-add-button:hover { background: var(--border); }

    .event-links { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .event-links-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    .event-links-title { color: var(--sub-text); font-size: 12px; font-weight: 700; }

    .search-result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      text-align: left;
    }
    .search-result-links { margin-top: 10px; }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .month-navigation h1 {
      min-width: 140px;
      margin: 0;
      font-size: 22px;
      text-align: center;
      letter-spacing: -0.8px;
    }

    .arrow-button {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: #4e5968;
      font-size: 22px;
    }

    .arrow-button:hover, .today-button:hover { background: var(--green-light); }

    .today-button {
      padding: 9px 15px;
      border-radius: 10px;
      color: #4e5968;
      background: var(--background);
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .weekdays[hidden], .calendar-grid[hidden] { display: none; }

    .weekdays {
      padding-bottom: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-align: center;
    }

    .weekdays span:first-child { color: #f04452; }
    .weekdays span:last-child { color: var(--green-dark); }

    .holiday-chip {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      overflow: hidden;
      border-radius: 7px;
      color: white;
      background: #f04452;
      font-size: 10px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day {
      min-height: 88px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      text-align: left;
      transition: 0.15s;
    }

    .day:not(.empty):hover { background: #f7faf2; }
    .day.holiday { background: #fdedee; }
    .day.selected { border-color: #a9cf75; background: #f4fae9; }

    .day-number {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      color: #4e5968;
      font-size: 13px;
    }

    .day.sunday .day-number { color: #f04452; }
    .day.saturday .day-number { color: var(--green-dark); }
    .day.holiday .day-number { color: #f04452; }
    .day.today .day-number { color: white; background: var(--green); font-weight: 700; }

    .event-chip {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      overflow: hidden;
      border-radius: 7px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin: 5px 3px 0;
      overflow: hidden;
    }

    .participant-dot {
      padding: 2px 4px;
      border-radius: 5px;
      color: white;
      background: var(--person-color);
      font-size: 8px;
      font-weight: 800;
    }

    .more-events {
      display: block;
      margin: 4px 0 0 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .detail-card {
      align-self: start;
      min-height: 500px;
      padding: 28px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .detail-label { margin: 0 0 7px; color: var(--muted); font-size: 12px; }
    .detail-header h2 { margin: 0; font-size: 21px; letter-spacing: -0.7px; }

    .add-button {
      flex: none;
      padding: 10px 13px;
      border-radius: 12px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .add-button:hover, .submit-button:hover { background: var(--green-dark); }

    .event-list { display: grid; gap: 14px; padding-top: 20px; }

    .event-item {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fcfef9;
    }

    .event-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .event-item-header h3 { margin: 0; font-size: 19px; letter-spacing: -0.5px; }
    .event-item-actions { display: flex; flex: none; gap: 6px; }
    .icon-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      color: var(--sub-text);
      background: var(--background);
      font-size: 14px;
    }
    .icon-button:hover { background: var(--border); }
    .icon-button.delete-button:hover { color: #f04452; background: #fde8ea; }
    .event-information { display: grid; gap: 7px; color: var(--sub-text); font-size: 13px; }
    .event-information p { margin: 0; }

    .participant-title {
      margin: 18px 0 10px;
      color: var(--sub-text);
      font-size: 12px;
    }

    .participant-list { display: flex; flex-wrap: wrap; gap: 7px; }

    .participant {
      padding: 7px 10px;
      border: 1px solid var(--person-color);
      border-radius: 999px;
      color: var(--person-color);
      background: white;
      font-size: 12px;
      font-weight: 700;
      transition: 0.15s;
    }

    .participant.joined {
      color: white;
      background: var(--person-color);
      box-shadow: 0 3px 8px color-mix(in srgb, var(--person-color) 28%, transparent);
    }

    .participant.joined::before { content: "✓ "; }

    .empty-state { padding: 65px 10px; color: var(--muted); text-align: center; }
    .empty-icon { display: block; margin-bottom: 14px; font-size: 32px; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.6; }

    dialog {
      width: min(430px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 22px;
      color: var(--text);
      box-shadow: 0 24px 70px rgba(25, 31, 40, 0.22);
    }

    dialog::backdrop { background: rgba(25, 31, 40, 0.45); backdrop-filter: blur(2px); }

    .dialog-content { padding: 28px; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .dialog-header h2 { margin: 0; font-size: 21px; }
    .close-button { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); background: var(--background); font-size: 20px; }
    .close-button:hover { background: var(--border); }

    .event-form { display: grid; gap: 17px; }
    .form-field { display: grid; gap: 8px; }
    .form-field label { font-size: 13px; font-weight: 700; }
    .form-field input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      outline: none;
    }
    .form-field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }
    .submit-button { width: 100%; height: 50px; margin-top: 5px; border-radius: 13px; color: white; background: var(--green); font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 30;
      padding: 14px 22px;
      border-radius: 13px;
      color: white;
      background: rgba(25, 31, 40, 0.94);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 15px);
      transition: 0.25s;
      font-size: 13px;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 850px) {
      .main-content { grid-template-columns: 1fr; }
      .detail-card { min-height: auto; }
    }

    @media (max-width: 620px) {
      .header { height: 62px; padding: 0 18px; }
      .main-content { margin-bottom: 60px; padding: 24px 12px 0; }
      .calendar-card { padding: 20px 10px; border-radius: 18px; }
      .calendar-header { padding: 0 8px; }
      .month-navigation { gap: 5px; }
      .month-navigation h1 { min-width: 110px; font-size: 18px; }
      .day { min-height: 66px; padding: 4px 2px; }
      .event-chip { padding: 4px 3px; font-size: 8px; }
      .calendar-participants { gap: 2px; margin: 3px 1px 0; }
      .participant-dot { padding: 1px 2px; font-size: 7px; }
      .more-events { display: none; }
      .detail-card { padding: 20px; border-radius: 18px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span>페테르 탐방</span>
    </div>
    <button id="gcalButton" class="gcal-button" title="구글 캘린더 연동">📅 구글 캘린더</button>
    <div id="syncStatus" class="sync-status">
      <span class="sync-dot"></span>
      <span id="syncLabel">연결 중</span>
    </div>
  </header>

  <main class="main-content">
    <section class="calendar-card" aria-label="기업 탐방 캘린더">
      <div class="calendar-header">
        <div class="month-navigation">
          <button id="previousMonth" class="arrow-button" aria-label="이전 달">‹</button>
          <h1 id="monthTitle"></h1>
          <button id="nextMonth" class="arrow-button" aria-label="다음 달">›</button>
        </div>
        <button id="todayButton" class="today-button">오늘</button>
      </div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="🔍 기업명으로 검색" autocomplete="off">
      </div>

      <div class="weekdays" id="weekdaysRow" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="searchResults" class="search-results" hidden></div>
    </section>

    <aside class="detail-card" aria-live="polite" aria-label="탐방 일정과 참여자">
      <div class="detail-header">
        <div>
          <p class="detail-label">선택한 날짜</p>
          <h2 id="selectedDate"></h2>
        </div>
        <button id="openEventForm" class="add-button">+ 탐방 추가</button>
      </div>
      <div id="eventList" class="event-list"></div>
    </aside>
  </main>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="dialogTitle">기업 탐방 추가</h2>
        <button id="closeEventForm" class="close-button" aria-label="닫기">×</button>
      </div>
      <form id="eventForm" class="event-form">
        <div class="form-field">
          <label for="companyName">기업명</label>
          <input id="companyName" name="companyName" type="text" maxlength="50" placeholder="기업명을 입력하세요" required>
        </div>
        <div class="form-field">
          <label for="eventTime">시간</label>
          <input id="eventTime" name="eventTime" type="time" required>
        </div>
        <div class="form-field">
          <label for="eventPlace">장소</label>
          <input id="eventPlace" name="eventPlace" type="text" maxlength="100" placeholder="방문 장소를 입력하세요" required>
        </div>
        <button class="submit-button" type="submit">캘린더에 추가하기</button>
      </form>
    </div>
  </dialog>

  <dialog id="linkDialog" aria-labelledby="linkDialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="linkDialogTitle">기업명</h2>
        <button id="closeLinkDialog" class="close-button" aria-label="닫기">×</button>
      </div>
      <p class="setup-copy">이 탐방과 관련된 자료 링크를 남겨보세요 (리포트, 공시, 회의록 등)</p>
      <form id="linkForm" class="event-form">
        <div class="form-field">
          <label for="linkLabelInput">제목 (선택)</label>
          <input id="linkLabelInput" type="text" maxlength="50" placeholder="예: 2026년 3분기 리포트">
        </div>
        <div class="form-field">
          <label for="linkUrlInput">링크</label>
          <input id="linkUrlInput" type="text" placeholder="https://...">
        </div>
        <button class="submit-button" type="submit">링크 추가</button>
      </form>
      <div id="linkList" class="link-list"></div>
    </div>
  </dialog>

  <dialog id="gcalDialog" aria-labelledby="gcalDialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="gcalDialogTitle">구글 캘린더 연동</h2>
        <button id="closeGcalDialog" class="close-button" aria-label="닫기">×</button>
      </div>
      <p class="setup-copy">
        아래 링크를 복사해서 구글 캘린더에 등록하면, 탐방 일정이 자동으로 구글 캘린더에도 나타나요.<br>
        (구글 캘린더 → 왼쪽 '다른 캘린더' 옆 + 버튼 → URL로 추가)<br>
        새로 추가/수정된 일정은 구글이 몇 시간 주기로 가져가서, 바로바로 반영되진 않아요.
      </p>
      <div class="copy-row">
        <input id="gcalUrlInput" type="text" readonly>
        <button id="copyGcalUrl">복사</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const participants = [
      { name: "장원", color: "#e05d5d" },
      { name: "현규", color: "#dc8b21" },
      { name: "남훈", color: "#b69b13" },
      { name: "상현", color: "#58a537" },
      { name: "학민", color: "#239b83" },
      { name: "두영", color: "#397fc4" },
      { name: "경민", color: "#7559c8" },

    function makeDateKey(year, month, day) {
      return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function formatSelectedDate(key) {
      const [year, month, day] = key.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      const holidayName = HOLIDAYS[key];
      return month + "월 " + day + "일 " + weekdays[date.getDay()] + "요일" + (holidayName ? " · " + holidayName : "");
    }

    function loadCache(key) {
      try {
        const saved = JSON.parse(localStorage.getItem(key) || "{}");
        return saved && typeof saved === "object" ? saved : {};
      } catch (error) {
        return {};
      }
    }

    function cacheLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      } catch (error) { /* ignore quota errors */ }
    }

    function migrateCompanyLinks(eventsData, legacyCompanyLinks) {
      if (!legacyCompanyLinks || typeof legacyCompanyLinks !== "object") return;
      Object.keys(legacyCompanyLinks).forEach(function (companyName) {
        const legacyLinks = legacyCompanyLinks[companyName];
        if (!Array.isArray(legacyLinks) || legacyLinks.length === 0) return;
        Object.keys(eventsData).forEach(function (dateKey) {
          const dateEvents = eventsData[dateKey];
          if (!Array.isArray(dateEvents)) return;
          dateEvents.forEach(function (eventItem) {
            const hasLinks = Array.isArray(eventItem.links) && eventItem.links.length > 0;
            if (eventItem.company === companyName && !hasLinks) {
              eventItem.links = legacyLinks.map(function (link) {
                return { url: link.url, label: link.label };
              });
            }
          });
        });
      });
    }

    // ---------- Remote storage (GitHub Gist) ----------

    async function remoteGet() {
      const headers = { Accept: "application/vnd.github+json" };
      if (gistToken) headers.Authorization = "token " + gistToken;
      const response = await fetch("https://api.github.com/gists/" + GIST_ID + "?_=" + Date.now(), {
        headers: headers,
        cache: "no-store"
      });
      if (!response.ok) throw new Error("GET " + response.status);
      const data = await response.json();
      const file = data.files && data.files[GIST_FILENAME];
      if (!file) throw new Error("missing file");
      return JSON.parse(file.content);
    }

    function ensureToken() {
      if (!gistToken) {
        const entered = window.prompt("참여 기록을 저장하려면 접근 코드를 입력해주세요 (경민님에게 문의)");
        if (entered && entered.trim()) {
          gistToken = entered.trim();
          localStorage.setItem(TOKEN_STORAGE_KEY, gistToken);
        }
      }
      return gistToken;
    }

    function escapeIcsText(text) {
      return String(text).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
    }

    function formatIcsLocalDateTime(dateKey, time) {
      const [year, month, day] = dateKey.split("-");
      const [hour, minute] = (time || "00:00").split(":");
      return year + month + day + "T" + hour.padStart(2, "0") + minute.padStart(2, "0") + "00";
    }

    function formatIcsUtcStamp(date) {
      return date.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    }

    function buildIcs(eventsData) {
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Peter Exploration//Calendar//KO",
        "CALSCALE:GREGORIAN",
        "X-WR-CALNAME:페테르 탐방"
      ];
      const stamp = formatIcsUtcStamp(new Date());
      Object.keys(eventsData || {}).sort().forEach(function (dateKey) {
        const dateEvents = Array.isArray(eventsData[dateKey]) ? eventsData[dateKey] : [];
        dateEvents.forEach(function (event, index) {
          const startLocal = formatIcsLocalDateTime(dateKey, event.time);
          const joined = Array.isArray(event.joined) ? event.joined : [];
          lines.push(
            "BEGIN:VEVENT",
            "UID:" + dateKey + "-" + index + "@peter-exploration",
            "DTSTAMP:" + stamp,
            "DTSTART;TZID=Asia/Seoul:" + startLocal,
            "DURATION:PT1H",
            "SUMMARY:" + escapeIcsText(event.company || ""),
            "LOCATION:" + escapeIcsText(event.place || ""),
            "DESCRIPTION:" + escapeIcsText(joined.length > 0 ? "참여: " + joined.join(", ") : "참여자 없음"),
            "END:VEVENT"
          );
        });
      });
      lines.push("END:VCALENDAR");
      return lines.join("\r\n") + "\r\n";
    }

    async function remotePut(data, interactive) {
      const token = interactive === false ? gistToken : ensureToken();
      if (!token) throw new Error("no token");
      const response = await fetch("https://api.github.com/gists/" + GIST_ID, {
        method: "PATCH",
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: "token " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(data) },
            [ICS_FILENAME]: { content: buildIcs(data.events) }
          }
        })
      });
      if (!response.ok) {
        if (response.status === 401) {
          gistToken = "";
          localStorage.removeItem(TOKEN_STORAGE_KEY);
        }
        throw new Error("PATCH " + response.status);
      }
    }

    const pendingDateKeys = new Set();

    function hasPending() {
      return pendingDateKeys.size > 0;
    }

    function applyPending(remoteEvents) {
      pendingDateKeys.forEach(function (key) { remoteEvents[key] = events[key]; });
    }

    async function fetchRemoteEvents() {
      if (syncing) return;
      setSyncStatus("syncing");
      try {
        const remote = await remoteGet();
        const remoteEvents = remote && typeof remote.events === "object" && remote.events !== null ? remote.events : {};
        migrateCompanyLinks(remoteEvents, remote && remote.companyLinks);
        applyPending(remoteEvents);
        events = remoteEvents;
        cacheLocal();
        renderCalendar();
        renderEventList();
        refreshSearchIfActive();
        renderLinkDialogIfOpen();
        setSyncStatus(hasPending() ? "offline" : "online");
      } catch (error) {
        setSyncStatus("offline");
      }
      if (hasPending()) retryPending();
    }

    function retryPending() {
      const nextDateKey = pendingDateKeys.values().next().value;
      if (nextDateKey !== undefined) syncDateKey(nextDateKey, false);
    }

    async function syncDateKey(dateKey, interactive) {
      pendingDateKeys.add(dateKey);
      syncing = true;
      setSyncStatus("syncing");
      const localDateEvents = events[dateKey];
      try {
        const remote = await remoteGet();
        const mergedEvents = remote && typeof remote.events === "object" && remote.events !== null ? remote.events : {};
        migrateCompanyLinks(mergedEvents, remote && remote.companyLinks);
        pendingDateKeys.forEach(function (k) { if (k !== dateKey) mergedEvents[k] = events[k]; });
        mergedEvents[dateKey] = localDateEvents;
        await remotePut({ events: mergedEvents }, interactive);
        events = mergedEvents;
        pendingDateKeys.delete(dateKey);
        cacheLocal();
        setSyncStatus(hasPending() ? "offline" : "online");
      } catch (error) {
        setSyncStatus("offline");
        cacheLocal();
      } finally {
        syncing = false;
        renderCalendar();
        renderEventList();
        refreshSearchIfActive();
        renderLinkDialogIfOpen();
      }
    }

    function startSync() {
      fetchRemoteEvents();
      setInterval(function () {
        if (document.visibilityState === "visible") fetchRemoteEvents();
      }, POLL_INTERVAL_MS);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") fetchRemoteEvents();
      });
    }

    // ---------- Search ----------

    function findMatches(query) {
      const needle = query.trim().toLowerCase();
      if (!needle) return [];
      const matches = [];
      Object.keys(events).sort().forEach(function (dateKey) {
        const dateEvents = Array.isArray(events[dateKey]) ? events[dateKey] : [];
        dateEvents.forEach(function (event, index) {
          if (event.company && event.company.toLowerCase().includes(needle)) {
            matches.push({ dateKey: dateKey, index: index, event: event });
          }
        });
      });
      return matches;
    }

    function renderSearchResults(query) {
      const matches = findMatches(query);
      searchResults.replaceChildren();

      const countLabel = document.createElement("p");
      countLabel.className = "search-results-count";
      countLabel.textContent = matches.length > 0
        ? "'" + query.trim() + "' 탐방 " + matches.length + "건"
        : "'" + query.trim() + "'(으)로 검색된 탐방이 없어요";
      searchResults.appendChild(countLabel);

      const companyOrder = [];
      const matchesByCompany = {};
      matches.forEach(function (match) {
        const name = match.event.company;
        if (!matchesByCompany[name]) {
          matchesByCompany[name] = [];
          companyOrder.push(name);
        }
        matchesByCompany[name].push(match);
      });

      companyOrder.forEach(function (companyName) {
        const group = document.createElement("div");
        group.className = "company-group";

        const groupMatches = matchesByCompany[companyName];
        const totalLinks = groupMatches.reduce(function (sum, match) {
          return sum + (Array.isArray(match.event.links) ? match.event.links.length : 0);
        }, 0);

        const header = document.createElement("div");
        header.className = "company-group-header";
        const nameSpan = document.createElement("span");
        nameSpan.className = "company-group-name";
        nameSpan.textContent = companyName;
        const badge = document.createElement("span");
        badge.className = "company-group-badge";
        badge.textContent = groupMatches.length + "회 방문" + (totalLinks > 0 ? " · 🔗 자료 " + totalLinks : "");
        header.append(nameSpan, badge);
        group.appendChild(header);

        groupMatches.forEach(function (match) {
          const item = document.createElement("div");
          item.className = "search-result-item";

          const navButton = document.createElement("button");
          navButton.type = "button";
          navButton.className = "search-result-top";

          const main = document.createElement("div");
          main.className = "search-result-main";
          const title = document.createElement("h3");
          title.textContent = formatSelectedDate(match.dateKey);
          const meta = document.createElement("p");
          meta.textContent = "◷ " + match.event.time + "  ⌖ " + match.event.place;
          main.append(title, meta);
          navButton.appendChild(main);

          navButton.addEventListener("click", function () {
            const [year, month] = match.dateKey.split("-").map(Number);
            currentMonth = new Date(year, month - 1, 1);
            selectedKey = match.dateKey;
            searchInput.value = "";
            setSearchMode(false);
            renderCalendar();
            renderEventList();
          });
          item.appendChild(navButton);

          const linksRow = document.createElement("div");
          linksRow.className = "search-result-links";
          linksRow.appendChild(buildLinkChips(match.dateKey, match.index));
          item.appendChild(linksRow);

          group.appendChild(item);
        });

        searchResults.appendChild(group);
      });
    }

    function setSearchMode(isSearching) {
      weekdaysRow.hidden = isSearching;
      calendarGrid.hidden = isSearching;
      searchResults.hidden = !isSearching;
    }

    function refreshSearchIfActive() {
      if (searchInput.value.trim()) renderSearchResults(searchInput.value);
    }

    // ---------- Per-visit reference links ----------

    function getLinkTargetEvent(target) {
      if (!target) return null;
      const dateEvents = events[target.dateKey];
      if (!Array.isArray(dateEvents) || !dateEvents[target.index]) return null;
      return dateEvents[target.index];
    }

    function buildLinkChips(dateKey, index) {
      const wrapper = document.createElement("div");
      wrapper.className = "link-chips";

      const targetEvent = getLinkTargetEvent({ dateKey: dateKey, index: index });
      const links = targetEvent && Array.isArray(targetEvent.links) ? targetEvent.links : [];

      links.forEach(function (link) {
        const chip = document.createElement("a");
        chip.className = "link-chip";
        chip.href = link.url;
        chip.target = "_blank";
        chip.rel = "noopener noreferrer";
        chip.textContent = "🔗 " + (link.label && link.label.trim() ? link.label : link.url);
        wrapper.appendChild(chip);
      });

      const addButton = document.createElement("button");
      addButton.type = "button";
      addButton.className = "link-add-button";
      addButton.textContent = links.length > 0 ? "자료 관리" : "+ 자료 링크";
      addButton.addEventListener("click", function (event) {
        event.stopPropagation();
        openLinkDialog(dateKey, index);
      });
      wrapper.appendChild(addButton);

      return wrapper;
    }

    function openLinkDialog(dateKey, index) {
      currentLinkTarget = { dateKey: dateKey, index: index };
      const targetEvent = getLinkTargetEvent(currentLinkTarget);
      document.getElementById("linkDialogTitle").textContent = targetEvent
        ? targetEvent.company + " · " + formatSelectedDate(dateKey)
        : "탐방 자료";
      renderLinkList();
      linkDialog.showModal();
    }

    function renderLinkDialogIfOpen() {
      if (linkDialog.open && currentLinkTarget) renderLinkList();
    }

    function renderLinkList() {
      linkList.replaceChildren();
      const targetEvent = getLinkTargetEvent(currentLinkTarget);
      const links = targetEvent && Array.isArray(targetEvent.links) ? targetEvent.links : [];

      if (links.length === 0) {
        const empty = document.createElement("p");
        empty.className = "setup-note";
        empty.textContent = "아직 등록된 링크가 없어요.";
        linkList.appendChild(empty);
        return;
      }

      links.forEach(function (link, linkIndex) {
        const item = document.createElement("div");
        item.className = "link-list-item";

        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link.label && link.label.trim() ? link.label : link.url;
        item.appendChild(anchor);

        const removeButton = document.createElement("button");
        removeButton.className = "icon-button delete-button";
        removeButton.setAttribute("aria-label", "링크 삭제");
        removeButton.textContent = "🗑";
        removeButton.addEventListener("click", function () {
          links.splice(linkIndex, 1);
          renderLinkList();
          renderEventList();
          refreshSearchIfActive();
          syncDateKey(currentLinkTarget.dateKey);
        });
        item.appendChild(removeButton);

        linkList.appendChild(item);
      });
    }

    document.getElementById("closeLinkDialog").addEventListener("click", function () {
      linkDialog.close();
    });

    linkDialog.addEventListener("click", function (event) {
      if (event.target === linkDialog) linkDialog.close();

    linkDialog.addEventListener("close", function () {
      currentLinkTarget = null;
    });

    const gcalDialog = document.getElementById("gcalDialog");
    document.getElementById("gcalButton").addEventListener("click", function () {

    document.getElementById("copyGcalUrl").addEventListener("click", async function () {
      const input = document.getElementById("gcalUrlInput");
      input.select();
      try {
        await navigator.clipboard.writeText(input.value);

        document.execCommand("copy");
      }
      showToast("링크가 복사됐어요");

    linkForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const label = document.getElementById("linkLabelInput").value.trim();
      let url = document.getElementById("linkUrlInput").value.trim();
      if (!url || !currentLinkTarget) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      const targetEvent = getLinkTargetEvent(currentLinkTarget);
      if (!targetEvent) return;
      if (!Array.isArray(targetEvent.links)) targetEvent.links = [];
      targetEvent.links.push({ url: url, label: label });
      linkForm.reset();
      renderLinkList();
      renderEventList();
      refreshSearchIfActive();
      showToast("링크가 추가됐어요");
      syncDateKey(currentLinkTarget.dateKey);
    });

    searchInput.addEventListener("input", function () {
      const query = searchInput.value;
      if (!query.trim()) {
        setSearchMode(false);
        return;

      setSearchMode(true);
      renderSearchResults(query);

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const todayKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());

      monthTitle.textContent = year + "년 " + (month + 1) + "월";
      calendarGrid.replaceChildren();

      for (let index = 0; index < firstWeekday; index += 1) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day empty";
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day += 1) {
        const key = makeDateKey(year, month, day);
        const dateEvents = Array.isArray(events[key]) ? events[key] : [];
        const weekday = new Date(year, month, day).getDay();
        const holidayName = HOLIDAYS[key];
        const button = document.createElement("button");
        button.className = "day";
        button.setAttribute("aria-label", (month + 1) + "월 " + day + "일" + (holidayName ? ", " + holidayName : "") + ", 탐방 " + dateEvents.length + "개");

        if (weekday === 0) button.classList.add("sunday");
        if (weekday === 6) button.classList.add("saturday");
        if (holidayName) button.classList.add("holiday");
        if (key === selectedKey) button.classList.add("selected");
        if (key === todayKey) button.classList.add("today");

        const dayNumber = document.createElement("span");
        dayNumber.className = "day-number";
        dayNumber.textContent = day;
        button.appendChild(dayNumber);

        if (holidayName) {
          const holidayChip = document.createElement("span");
          holidayChip.className = "holiday-chip";
          holidayChip.textContent = holidayName;
          button.appendChild(holidayChip);
        }

        if (dateEvents.length > 0) {
          const chip = document.createElement("span");
          chip.className = "event-chip";
          chip.textContent = dateEvents[0].company;
          button.appendChild(chip);

          const joinedNames = Array.from(new Set(dateEvents.flatMap(function (dateEvent) {
            return Array.isArray(dateEvent.joined) ? dateEvent.joined : [];
          })));
          if (joinedNames.length > 0) {
            const joinedList = document.createElement("span");
            joinedList.className = "calendar-participants";
            joinedList.setAttribute("aria-label", "참여자: " + joinedNames.join(", "));
            joinedNames.forEach(function (name) {
              const participant = participants.find(function (person) { return person.name === name; });
              if (!participant) return;
              const dot = document.createElement("span");
              dot.className = "participant-dot";
              dot.style.setProperty("--person-color", participant.color);
              dot.textContent = name;
              dot.title = name;
              joinedList.appendChild(dot);
            });
            button.appendChild(joinedList);
          }

          if (dateEvents.length > 1) {
            const more = document.createElement("span");
            more.className = "more-events";
            more.textContent = "+" + (dateEvents.length - 1) + "개 더보기";
            button.appendChild(more);
          }
        }

        button.addEventListener("click", function () {
          selectedKey = key;
          renderCalendar();
          renderEventList();
        });
        calendarGrid.appendChild(button);
      }
    }

    function renderEventList() {
      const dateEvents = Array.isArray(events[selectedKey]) ? events[selectedKey] : [];
      selectedDate.textContent = formatSelectedDate(selectedKey);
      eventList.replaceChildren();

      if (dateEvents.length === 0) {
        const emptyState = document.createElement("div");
        emptyState.className = "empty-state";
        emptyState.innerHTML = '<span class="empty-icon">🏢</span><strong>등록된 기업 탐방이 없어요</strong><p>탐방 추가 버튼을 눌러<br>새 일정을 등록해 보세요.</p>';
        eventList.appendChild(emptyState);
        return;
      }

      dateEvents.forEach(function (event, eventIndex) {
        if (!Array.isArray(event.joined)) event.joined = [];
        const item = document.createElement("article");
        item.className = "event-item";

        const header = document.createElement("div");
        header.className = "event-item-header";

        const title = document.createElement("h3");
        title.textContent = event.company;
        header.appendChild(title);

        const actions = document.createElement("div");
        actions.className = "event-item-actions";

        const editButton = document.createElement("button");
        editButton.className = "icon-button edit-button";
        editButton.setAttribute("aria-label", "수정");
        editButton.textContent = "✎";
        editButton.addEventListener("click", function () {
          openEventForm(eventIndex);
        });
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "icon-button delete-button";
        deleteButton.setAttribute("aria-label", "삭제");
        deleteButton.textContent = "🗑";
        deleteButton.addEventListener("click", function () {
          deleteEvent(eventIndex);
        });
        actions.appendChild(deleteButton);

        header.appendChild(actions);
        item.appendChild(header);

        const information = document.createElement("div");
        information.className = "event-information";
        const time = document.createElement("p");
        time.textContent = "◷ " + event.time;
        const place = document.createElement("p");
        place.textContent = "⌖ " + event.place;
        information.append(time, place);
        item.appendChild(information);

        const participantTitle = document.createElement("p");
        participantTitle.className = "participant-title";
        participantTitle.textContent = "참여할 이름을 눌러주세요";
        item.appendChild(participantTitle);

        const participantList = document.createElement("div");
        participantList.className = "participant-list";
        participants.forEach(function (participant) {
          const button = document.createElement("button");
          const isJoined = event.joined.includes(participant.name);
          button.className = "participant" + (isJoined ? " joined" : "");
          button.style.setProperty("--person-color", participant.color);
          button.textContent = participant.name;
          button.setAttribute("aria-pressed", String(isJoined));
          button.addEventListener("click", function () {
            toggleParticipant(eventIndex, participant.name);
          });
          participantList.appendChild(button);
        });
        item.appendChild(participantList);

        const linksSection = document.createElement("div");
        linksSection.className = "event-links";
        const linksHeader = document.createElement("div");
        linksHeader.className = "event-links-header";
        const linksTitle = document.createElement("span");
        linksTitle.className = "event-links-title";
        linksTitle.textContent = "🔗 자료 링크";
        linksHeader.appendChild(linksTitle);
        linksSection.appendChild(linksHeader);
        linksSection.appendChild(buildLinkChips(selectedKey, eventIndex));
        item.appendChild(linksSection);

        eventList.appendChild(item);
      });
    }

    function toggleParticipant(eventIndex, participantName) {
      const dateEvents = events[selectedKey];
      if (!Array.isArray(dateEvents) || !dateEvents[eventIndex]) return;
      const joined = dateEvents[eventIndex].joined;
      const joinedIndex = joined.indexOf(participantName);
      if (joinedIndex === -1) {
        joined.push(participantName);
        showToast(participantName + "님이 참여했어요");
      } else {
        joined.splice(joinedIndex, 1);
        showToast(participantName + "님의 참여가 취소됐어요");
      }
      renderCalendar();
      renderEventList();
      syncDateKey(selectedKey);
    }

    document.getElementById("previousMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("todayButton").addEventListener("click", function () {
      currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      selectedKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());
      renderCalendar();
      renderEventList();
    });

    function openEventForm(editIndex) {
      const dialogTitleEl = document.getElementById("dialogTitle");
      const submitButton = eventForm.querySelector(".submit-button");
      if (typeof editIndex === "number") {
        editingIndex = editIndex;
        const event = events[selectedKey][editIndex];
        document.getElementById("companyName").value = event.company;
        document.getElementById("eventTime").value = event.time;
        document.getElementById("eventPlace").value = event.place;
        dialogTitleEl.textContent = "탐방 수정";
        submitButton.textContent = "수정하기";
      } else {
        editingIndex = null;
        eventForm.reset();
        dialogTitleEl.textContent = "기업 탐방 추가";
        submitButton.textContent = "캘린더에 추가하기";
      }
      eventDialog.showModal();
      document.getElementById("companyName").focus();
    }

    function deleteEvent(eventIndex) {
      const dateEvents = events[selectedKey];
      if (!Array.isArray(dateEvents) || !dateEvents[eventIndex]) return;
      const company = dateEvents[eventIndex].company;
      if (!window.confirm(company + " 탐방을 삭제할까요?")) return;
      dateEvents.splice(eventIndex, 1);
      renderCalendar();
      renderEventList();
      showToast(company + " 탐방이 삭제됐어요");
      syncDateKey(selectedKey);
    }

    document.getElementById("openEventForm").addEventListener("click", function () {
      openEventForm();
    });

    document.getElementById("closeEventForm").addEventListener("click", function () {
      eventDialog.close();
    });

    eventDialog.addEventListener("click", function (event) {
      if (event.target === eventDialog) eventDialog.close();
    });

    eventForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const formData = new FormData(eventForm);
      const company = formData.get("companyName").trim();
      const time = formData.get("eventTime");
      const place = formData.get("eventPlace").trim();

      if (!company || !time || !place) return;
      if (!Array.isArray(events[selectedKey])) events[selectedKey] = [];

      if (editingIndex !== null && events[selectedKey][editingIndex]) {
        const existing = events[selectedKey][editingIndex];
        existing.company = company;
        existing.time = time;
        existing.place = place;
        showToast(company + " 탐방이 수정됐어요");
      } else {
        events[selectedKey].push({ company: company, time: time, place: place, joined: [], links: [] });
        showToast(company + " 탐방이 추가됐어요");
      }

      eventForm.reset();
      editingIndex = null;
      eventDialog.close();
      renderCalendar();
      renderEventList();
      syncDateKey(selectedKey);
    });

    renderCalendar();
    renderEventList();
    setSyncStatus("idle");
    startSync();
  </script>
</body>
</html>
