<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페테르 탐방</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    :root {
      --green: #78b82a;
      --green-dark: #4f8616;
      --green-light: #eff9df;
      --text: #191f28;
      --sub-text: #6b7684;
      --muted: #8b95a1;
      --background: #f6faef;
      --border: #e1ebd5;
      --white: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--background);
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; background: transparent; }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: 70px;
      padding: 0 max(24px, calc((100vw - 1160px) / 2));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(15px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .logo-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
      font-size: 16px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 7px 11px;
      border-radius: 20px;
      background: var(--background);
      color: var(--sub-text);
      font-size: 12px;
      font-weight: 600;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .sync-status.online .sync-dot { background: var(--green); }
    .sync-status.syncing .sync-dot { background: #f5a623; }
    .sync-status.offline .sync-dot { background: #f04452; }

    .main-content {
      display: grid;
      grid-template-columns: minmax(600px, 1.8fr) minmax(320px, 0.9fr);
      gap: 22px;
      max-width: 1160px;
      margin: 0 auto 100px;
      padding: 40px 20px 0;
    }

    .calendar-card, .detail-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(55, 86, 18, 0.08);
      min-width: 0;
    }

    .calendar-card { padding: 30px; }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .search-row { margin-bottom: 18px; }
    .search-row input {
      width: 100%;
      height: 46px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--background);
      outline: none;
    }
    .search-row input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); background: white; }

    .search-results { display: grid; gap: 10px; }
    .search-results[hidden] { display: none; }
    .search-results-count { margin: 0 0 4px; color: var(--muted); font-size: 12px; }

    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfef9;
      text-align: left;
      transition: 0.15s;
    }
    .search-result-item:hover { border-color: #a9cf75; background: var(--green-light); }
    .search-result-main h3 { margin: 0 0 5px; font-size: 16px; letter-spacing: -0.4px; }
    .search-result-main p { margin: 0; color: var(--sub-text); font-size: 12px; }
    .search-result-date {
      flex: none;
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .company-group { display: grid; gap: 8px; margin-bottom: 14px; }
    .company-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--green-light);
      text-align: left;
      transition: 0.15s;
    }
    .company-group-header:hover { background: #e2f2c6; }
    .company-group-name { font-weight: 800; color: var(--green-dark); font-size: 15px; }
    .company-group-badge { font-size: 12px; color: var(--green-dark); font-weight: 700; white-space: nowrap; }

    .company-link-list { display: grid; gap: 8px; margin-top: 16px; }
    .company-link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fcfef9;
    }
    .company-link-item a {
      min-width: 0;
      overflow: hidden;
      color: var(--green-dark);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .company-link-item a:hover { text-decoration: underline; }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .month-navigation h1 {
      min-width: 140px;
      margin: 0;
      font-size: 22px;
      text-align: center;
      letter-spacing: -0.8px;
    }

    .arrow-button {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: #4e5968;
      font-size: 22px;
    }

    .arrow-button:hover, .today-button:hover { background: var(--green-light); }

    .today-button {
      padding: 9px 15px;
      border-radius: 10px;
      color: #4e5968;
      background: var(--background);
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .weekdays[hidden], .calendar-grid[hidden] { display: none; }

    .weekdays {
      padding-bottom: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-align: center;
    }

    .weekdays span:first-child { color: #f04452; }
    .weekdays span:last-child { color: var(--green-dark); }

    .day {
      min-height: 88px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      text-align: left;
      transition: 0.15s;
    }

    .day:not(.empty):hover { background: #f7faf2; }
    .day.selected { border-color: #a9cf75; background: #f4fae9; }

    .day-number {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      color: #4e5968;
      font-size: 13px;
    }

    .day.sunday .day-number { color: #f04452; }
    .day.saturday .day-number { color: var(--green-dark); }
    .day.today .day-number { color: white; background: var(--green); font-weight: 700; }

    .event-chip {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      overflow: hidden;
      border-radius: 7px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin: 5px 3px 0;
      overflow: hidden;
    }

    .participant-dot {
      padding: 2px 4px;
      border-radius: 5px;
      color: white;
      background: var(--person-color);
      font-size: 8px;
      font-weight: 800;
    }

    .more-events {
      display: block;
      margin: 4px 0 0 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .detail-card {
      align-self: start;
      min-height: 500px;
      padding: 28px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .detail-label { margin: 0 0 7px; color: var(--muted); font-size: 12px; }
    .detail-header h2 { margin: 0; font-size: 21px; letter-spacing: -0.7px; }

    .add-button {
      flex: none;
      padding: 10px 13px;
      border-radius: 12px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .add-button:hover, .submit-button:hover { background: var(--green-dark); }

    .event-list { display: grid; gap: 14px; padding-top: 20px; }

    .event-item {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fcfef9;
    }

    .event-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .event-item-header h3 { margin: 0; font-size: 19px; letter-spacing: -0.5px; }
    .event-item-actions { display: flex; flex: none; gap: 6px; }
    .icon-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      color: var(--sub-text);
      background: var(--background);
      font-size: 14px;
    }
    .icon-button:hover { background: var(--border); }
    .icon-button.delete-button:hover { color: #f04452; background: #fde8ea; }
    .event-information { display: grid; gap: 7px; color: var(--sub-text); font-size: 13px; }
    .event-information p { margin: 0; }

    .participant-title {
      margin: 18px 0 10px;
      color: var(--sub-text);
      font-size: 12px;
    }

    .participant-list { display: flex; flex-wrap: wrap; gap: 7px; }

    .participant {
      padding: 7px 10px;
      border: 1px solid var(--person-color);
      border-radius: 999px;
      color: var(--person-color);
      background: white;
      font-size: 12px;
      font-weight: 700;
      transition: 0.15s;
    }

    .participant.joined {
      color: white;
      background: var(--person-color);
      box-shadow: 0 3px 8px color-mix(in srgb, var(--person-color) 28%, transparent);
    }

    .participant.joined::before { content: "✓ "; }

    .empty-state { padding: 65px 10px; color: var(--muted); text-align: center; }
    .empty-icon { display: block; margin-bottom: 14px; font-size: 32px; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.6; }

    dialog {
      width: min(430px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 22px;
      color: var(--text);
      box-shadow: 0 24px 70px rgba(25, 31, 40, 0.22);
    }

    dialog::backdrop { background: rgba(25, 31, 40, 0.45); backdrop-filter: blur(2px); }

    .dialog-content { padding: 28px; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .dialog-header h2 { margin: 0; font-size: 21px; }
    .close-button { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); background: var(--background); font-size: 20px; }
    .close-button:hover { background: var(--border); }

    .event-form { display: grid; gap: 17px; }
    .form-field { display: grid; gap: 8px; }
    .form-field label { font-size: 13px; font-weight: 700; }
    .form-field input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      outline: none;
    }
    .form-field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }
    .submit-button { width: 100%; height: 50px; margin-top: 5px; border-radius: 13px; color: white; background: var(--green); font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 30;
      padding: 14px 22px;
      border-radius: 13px;
      color: white;
      background: rgba(25, 31, 40, 0.94);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 15px);
      transition: 0.25s;
      font-size: 13px;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 850px) {
      .main-content { grid-template-columns: 1fr; }
      .detail-card { min-height: auto; }
    }

    @media (max-width: 620px) {
      .header { height: 62px; padding: 0 18px; }
      .main-content { margin-bottom: 60px; padding: 24px 12px 0; }
      .calendar-card { padding: 20px 10px; border-radius: 18px; }
      .calendar-header { padding: 0 8px; }
      .month-navigation { gap: 5px; }
      .month-navigation h1 { min-width: 110px; font-size: 18px; }
      .day { min-height: 66px; padding: 4px 2px; }
      .event-chip { padding: 4px 3px; font-size: 8px; }
      .calendar-participants { gap: 2px; margin: 3px 1px 0; }
      .participant-dot { padding: 1px 2px; font-size: 7px; }
      .more-events { display: none; }
      .detail-card { padding: 20px; border-radius: 18px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span>페테르 탐방</span>
    </div>
    <div id="syncStatus" class="sync-status">
      <span class="sync-dot"></span>
      <span id="syncLabel">연결 중</span>
    </div>
  </header>

  <main class="main-content">
    <section class="calendar-card" aria-label="기업 탐방 캘린더">
      <div class="calendar-header">
        <div class="month-navigation">
          <button id="previousMonth" class="arrow-button" aria-label="이전 달">‹</button>
          <h1 id="monthTitle"></h1>
          <button id="nextMonth" class="arrow-button" aria-label="다음 달">›</button>
        </div>
        <button id="todayButton" class="today-button">오늘</button>
      </div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="🔍 기업명으로 검색" autocomplete="off">
      </div>

      <div class="weekdays" id="weekdaysRow" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="searchResults" class="search-results" hidden></div>
    </section>

    <aside class="detail-card" aria-live="polite" aria-label="탐방 일정과 참여자">
      <div class="detail-header">
        <div>
          <p class="detail-label">선택한 날짜</p>
          <h2 id="selectedDate"></h2>
        </div>
        <button id="openEventForm" class="add-button">+ 탐방 추가</button>
      </div>
      <div id="eventList" class="event-list"></div>
    </aside>
  </main>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="dialogTitle">기업 탐방 추가</h2>
        <button id="closeEventForm" class="close-button" aria-label="닫기">×</button>
      </div>
      <form id="eventForm" class="event-form">
        <div class="form-field">
          <label for="companyName">기업명</label>
          <input id="companyName" name="companyName" type="text" maxlength="50" placeholder="기업명을 입력하세요" required>
        </div>
        <div class="form-field">
          <label for="eventTime">시간</label>
          <input id="eventTime" name="eventTime" type="time" required>
        </div>
        <div class="form-field">
          <label for="eventPlace">장소</label>
          <input id="eventPlace" name="eventPlace" type="text" maxlength="100" placeholder="방문 장소를 입력하세요" required>
        </div>
        <button class="submit-button" type="submit">캘린더에 추가하기</button>
      </form>
    </div>
  </dialog>

  <dialog id="companyDialog" aria-labelledby="companyDialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="companyDialogTitle">기업명</h2>
        <button id="closeCompanyDialog" class="close-button" aria-label="닫기">×</button>
      </div>
      <p class="setup-copy">탐방 관련 자료 링크를 남겨보세요 (리포트, 공시, 회의록 등)</p>
      <form id="companyLinkForm" class="event-form">
        <div class="form-field">
          <label for="companyLinkLabel">제목 (선택)</label>
          <input id="companyLinkLabel" type="text" maxlength="50" placeholder="예: 2026년 3분기 리포트">
        </div>
        <div class="form-field">
          <label for="companyLinkUrl">링크</label>
          <input id="companyLinkUrl" type="text" placeholder="https://...">
        </div>
        <button class="submit-button" type="submit">링크 추가</button>
      </form>
      <div id="companyLinkList" class="company-link-list"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const participants = [
      { name: "장원", color: "#e05d5d" },
      { name: "현규", color: "#dc8b21" },
      { name: "남훈", color: "#b69b13" },
      { name: "상현", color: "#58a537" },
      { name: "학민", color: "#239b83" },
      { name: "두영", color: "#397fc4" },
      { name: "경민", color: "#7559c8" },
      { name: "재현", color: "#c05298" }
    ];

    const STORAGE_KEY = "peterExplorationEvents";
    const COMPANY_STORAGE_KEY = "peterExplorationCompanyLinks";
    const TOKEN_STORAGE_KEY = "peterExplorationKey";
    const GIST_ID = "dd6c6671134c12aff5b63a4bc2d536e2";
    const GIST_FILENAME = "events.json";
    const POLL_INTERVAL_MS = 20000;

    let gistToken = localStorage.getItem(TOKEN_STORAGE_KEY) || "";

    const today = new Date();
    let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());
    let events = loadCache(STORAGE_KEY);
    let companyLinks = loadCache(COMPANY_STORAGE_KEY);
    let editingIndex = null;
    let currentCompanyName = null;
    let toastTimer;
    let syncing = false;

    const calendarGrid = document.getElementById("calendarGrid");
    const weekdaysRow = document.getElementById("weekdaysRow");
    const monthTitle = document.getElementById("monthTitle");
    const selectedDate = document.getElementById("selectedDate");
    const eventList = document.getElementById("eventList");
    const eventDialog = document.getElementById("eventDialog");
    const eventForm = document.getElementById("eventForm");
    const companyDialog = document.getElementById("companyDialog");
    const companyLinkForm = document.getElementById("companyLinkForm");
    const companyLinkList = document.getElementById("companyLinkList");
    const syncStatusEl = document.getElementById("syncStatus");
    const syncLabelEl = document.getElementById("syncLabel");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    function makeDateKey(year, month, day) {
      return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function formatSelectedDate(key) {
      const [year, month, day] = key.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      return month + "월 " + day + "일 " + weekdays[date.getDay()] + "요일";
    }

    function loadCache(key) {
      try {
        const saved = JSON.parse(localStorage.getItem(key) || "{}");
        return saved && typeof saved === "object" ? saved : {};
      } catch (error) {
        return {};
      }
    }

    function cacheLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        localStorage.setItem(COMPANY_STORAGE_KEY, JSON.stringify(companyLinks));
      } catch (error) { /* ignore quota errors */ }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2400);
    }

    function setSyncStatus(state) {
      syncStatusEl.classList.remove("online", "syncing", "offline");
      const labels = { online: "동기화됨", syncing: "동기화 중", offline: "오프라인", idle: "연결 중" };
      if (state !== "idle") syncStatusEl.classList.add(state);
      syncLabelEl.textContent = labels[state] || "연결 중";
    }

    // ---------- Remote storage (GitHub Gist) ----------

    async function remoteGet() {
      const headers = { Accept: "application/vnd.github+json" };
      if (gistToken) headers.Authorization = "token " + gistToken;
      const response = await fetch("https://api.github.com/gists/" + GIST_ID + "?_=" + Date.now(), {
        headers: headers,
        cache: "no-store"
      });
      if (!response.ok) throw new Error("GET " + response.status);
      const data = await response.json();
      const file = data.files && data.files[GIST_FILENAME];
      if (!file) throw new Error("missing file");
      return JSON.parse(file.content);
    }

    function ensureToken() {
      if (!gistToken) {
        const entered = window.prompt("참여 기록을 저장하려면 접근 코드를 입력해주세요 (경민님에게 문의)");
        if (entered && entered.trim()) {
          gistToken = entered.trim();
          localStorage.setItem(TOKEN_STORAGE_KEY, gistToken);
        }
      }
      return gistToken;
    }

    async function remotePut(data, interactive) {
      const token = interactive === false ? gistToken : ensureToken();
      if (!token) throw new Error("no token");
      const response = await fetch("https://api.github.com/gists/" + GIST_ID, {
        method: "PATCH",
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: "token " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(data) } } })
      });
      if (!response.ok) {
        if (response.status === 401) {
          gistToken = "";
          localStorage.removeItem(TOKEN_STORAGE_KEY);
        }
        throw new Error("PATCH " + response.status);
      }
    }

    const pendingDateKeys = new Set();
    const pendingCompanyKeys = new Set();

    function hasPending() {
      return pendingDateKeys.size > 0 || pendingCompanyKeys.size > 0;
    }

    function applyPending(remoteEvents, remoteCompanyLinks) {
      pendingDateKeys.forEach(function (key) { remoteEvents[key] = events[key]; });
      pendingCompanyKeys.forEach(function (key) { remoteCompanyLinks[key] = companyLinks[key]; });
    }

    async function fetchRemoteEvents() {
      if (syncing) return;
      setSyncStatus("syncing");
      try {
        const remote = await remoteGet();
        const remoteEvents = remote && typeof remote.events === "object" && remote.events !== null ? remote.events : {};
        const remoteCompanyLinks = remote && typeof remote.companyLinks === "object" && remote.companyLinks !== null ? remote.companyLinks : {};
        applyPending(remoteEvents, remoteCompanyLinks);
        events = remoteEvents;
        companyLinks = remoteCompanyLinks;
        cacheLocal();
        renderCalendar();
        renderEventList();
        refreshSearchIfActive();
        renderCompanyDialogIfOpen();
        setSyncStatus(hasPending() ? "offline" : "online");
      } catch (error) {
        setSyncStatus("offline");
      }
      if (hasPending()) retryPending();
    }

    function retryPending() {
      const nextDateKey = pendingDateKeys.values().next().value;
      if (nextDateKey !== undefined) { syncDateKey(nextDateKey, false); return; }
      const nextCompanyKey = pendingCompanyKeys.values().next().value;
      if (nextCompanyKey !== undefined) syncCompanyLinks(nextCompanyKey, false);
    }

    async function syncChange(kind, key, interactive) {
      const pendingSet = kind === "events" ? pendingDateKeys : pendingCompanyKeys;
      pendingSet.add(key);
      syncing = true;
      setSyncStatus("syncing");
      const localValue = kind === "events" ? events[key] : companyLinks[key];
      try {
        const remote = await remoteGet();
        const mergedEvents = remote && typeof remote.events === "object" && remote.events !== null ? remote.events : {};
        const mergedCompanyLinks = remote && typeof remote.companyLinks === "object" && remote.companyLinks !== null ? remote.companyLinks : {};
        pendingDateKeys.forEach(function (k) { if (!(kind === "events" && k === key)) mergedEvents[k] = events[k]; });
        pendingCompanyKeys.forEach(function (k) { if (!(kind === "companyLinks" && k === key)) mergedCompanyLinks[k] = companyLinks[k]; });
        if (kind === "events") mergedEvents[key] = localValue; else mergedCompanyLinks[key] = localValue;
        await remotePut({ events: mergedEvents, companyLinks: mergedCompanyLinks }, interactive);
        events = mergedEvents;
        companyLinks = mergedCompanyLinks;
        pendingSet.delete(key);
        cacheLocal();
        setSyncStatus(hasPending() ? "offline" : "online");
      } catch (error) {
        setSyncStatus("offline");
        cacheLocal();
      } finally {
        syncing = false;
        renderCalendar();
        renderEventList();
        refreshSearchIfActive();
        renderCompanyDialogIfOpen();
      }
    }

    function syncDateKey(dateKey, interactive) {
      return syncChange("events", dateKey, interactive);
    }

    function syncCompanyLinks(companyName, interactive) {
      return syncChange("companyLinks", companyName, interactive);
    }

    function startSync() {
      fetchRemoteEvents();
      setInterval(function () {
        if (document.visibilityState === "visible") fetchRemoteEvents();
      }, POLL_INTERVAL_MS);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") fetchRemoteEvents();
      });
    }

    // ---------- Search ----------

    function findMatches(query) {
      const needle = query.trim().toLowerCase();
      if (!needle) return [];
      const matches = [];
      Object.keys(events).sort().forEach(function (dateKey) {
        const dateEvents = Array.isArray(events[dateKey]) ? events[dateKey] : [];
        dateEvents.forEach(function (event) {
          if (event.company && event.company.toLowerCase().includes(needle)) {
            matches.push({ dateKey: dateKey, event: event });
          }
        });
      });
      return matches;
    }

    function renderSearchResults(query) {
      const matches = findMatches(query);
      searchResults.replaceChildren();

      const countLabel = document.createElement("p");
      countLabel.className = "search-results-count";
      countLabel.textContent = matches.length > 0
        ? "'" + query.trim() + "' 탐방 " + matches.length + "건"
        : "'" + query.trim() + "'(으)로 검색된 탐방이 없어요";
      searchResults.appendChild(countLabel);

      const companyOrder = [];
      const matchesByCompany = {};
      matches.forEach(function (match) {
        const name = match.event.company;
        if (!matchesByCompany[name]) {
          matchesByCompany[name] = [];
          companyOrder.push(name);
        }
        matchesByCompany[name].push(match);
      });

      companyOrder.forEach(function (companyName) {
        const group = document.createElement("div");
        group.className = "company-group";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "company-group-header";
        const nameSpan = document.createElement("span");
        nameSpan.className = "company-group-name";
        nameSpan.textContent = companyName;
        const linkCount = Array.isArray(companyLinks[companyName]) ? companyLinks[companyName].length : 0;
        const badge = document.createElement("span");
        badge.className = "company-group-badge";
        badge.textContent = "🔗 자료" + (linkCount > 0 ? " " + linkCount : "");
        header.append(nameSpan, badge);
        header.addEventListener("click", function () { openCompanyDialog(companyName); });
        group.appendChild(header);

        matchesByCompany[companyName].forEach(function (match) {
          const item = document.createElement("button");
          item.className = "search-result-item";

          const main = document.createElement("div");
          main.className = "search-result-main";
          const title = document.createElement("h3");
          title.textContent = formatSelectedDate(match.dateKey);
          const meta = document.createElement("p");
          meta.textContent = "◷ " + match.event.time + "  ⌖ " + match.event.place;
          main.append(title, meta);
          item.appendChild(main);

          item.addEventListener("click", function () {
            const [year, month] = match.dateKey.split("-").map(Number);
            currentMonth = new Date(year, month - 1, 1);
            selectedKey = match.dateKey;
            searchInput.value = "";
            setSearchMode(false);
            renderCalendar();
            renderEventList();
          });
          group.appendChild(item);
        });

        searchResults.appendChild(group);
      });
    }

    function setSearchMode(isSearching) {
      weekdaysRow.hidden = isSearching;
      calendarGrid.hidden = isSearching;
      searchResults.hidden = !isSearching;
    }

    function refreshSearchIfActive() {
      if (searchInput.value.trim()) renderSearchResults(searchInput.value);
    }

    // ---------- Company links ----------

    function openCompanyDialog(companyName) {
      currentCompanyName = companyName;
      document.getElementById("companyDialogTitle").textContent = companyName;
      renderCompanyLinkList();
      companyDialog.showModal();
    }

    function renderCompanyDialogIfOpen() {
      if (companyDialog.open && currentCompanyName) renderCompanyLinkList();
    }

    function renderCompanyLinkList() {
      companyLinkList.replaceChildren();
      const links = Array.isArray(companyLinks[currentCompanyName]) ? companyLinks[currentCompanyName] : [];

      if (links.length === 0) {
        const empty = document.createElement("p");
        empty.className = "setup-note";
        empty.textContent = "아직 등록된 링크가 없어요.";
        companyLinkList.appendChild(empty);
        return;
      }

      links.forEach(function (link, linkIndex) {
        const item = document.createElement("div");
        item.className = "company-link-item";

        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link.label && link.label.trim() ? link.label : link.url;
        item.appendChild(anchor);

        const removeButton = document.createElement("button");
        removeButton.className = "icon-button delete-button";
        removeButton.setAttribute("aria-label", "링크 삭제");
        removeButton.textContent = "🗑";
        removeButton.addEventListener("click", function () {
          links.splice(linkIndex, 1);
          renderCompanyLinkList();
          refreshSearchIfActive();
          syncCompanyLinks(currentCompanyName);
        });
        item.appendChild(removeButton);

        companyLinkList.appendChild(item);
      });
    }

    document.getElementById("closeCompanyDialog").addEventListener("click", function () {
      companyDialog.close();
    });

    companyDialog.addEventListener("click", function (event) {
      if (event.target === companyDialog) companyDialog.close();
    });

    companyDialog.addEventListener("close", function () {
      currentCompanyName = null;
    });

    companyLinkForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const label = document.getElementById("companyLinkLabel").value.trim();
      let url = document.getElementById("companyLinkUrl").value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      if (!Array.isArray(companyLinks[currentCompanyName])) companyLinks[currentCompanyName] = [];
      companyLinks[currentCompanyName].push({ url: url, label: label });
      companyLinkForm.reset();
      renderCompanyLinkList();
      refreshSearchIfActive();
      showToast("링크가 추가됐어요");
      syncCompanyLinks(currentCompanyName);
    });

    searchInput.addEventListener("input", function () {
      const query = searchInput.value;
      if (!query.trim()) {
        setSearchMode(false);
        return;
      }
      setSearchMode(true);
      renderSearchResults(query);
    });

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const todayKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());

      monthTitle.textContent = year + "년 " + (month + 1) + "월";
      calendarGrid.replaceChildren();

      for (let index = 0; index < firstWeekday; index += 1) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day empty";
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day += 1) {
        const key = makeDateKey(year, month, day);
        const dateEvents = Array.isArray(events[key]) ? events[key] : [];
        const weekday = new Date(year, month, day).getDay();
        const button = document.createElement("button");
        button.className = "day";
        button.setAttribute("aria-label", (month + 1) + "월 " + day + "일, 탐방 " + dateEvents.length + "개");

        if (weekday === 0) button.classList.add("sunday");
        if (weekday === 6) button.classList.add("saturday");
        if (key === selectedKey) button.classList.add("selected");
        if (key === todayKey) button.classList.add("today");

        const dayNumber = document.createElement("span");
        dayNumber.className = "day-number";
        dayNumber.textContent = day;
        button.appendChild(dayNumber);

        if (dateEvents.length > 0) {
          const chip = document.createElement("span");
          chip.className = "event-chip";
          chip.textContent = dateEvents[0].company;
          button.appendChild(chip);

          const joinedNames = Array.from(new Set(dateEvents.flatMap(function (dateEvent) {
            return Array.isArray(dateEvent.joined) ? dateEvent.joined : [];
          })));
          if (joinedNames.length > 0) {
            const joinedList = document.createElement("span");
            joinedList.className = "calendar-participants";
            joinedList.setAttribute("aria-label", "참여자: " + joinedNames.join(", "));
            joinedNames.forEach(function (name) {
              const participant = participants.find(function (person) { return person.name === name; });
              if (!participant) return;
              const dot = document.createElement("span");
              dot.className = "participant-dot";
              dot.style.setProperty("--person-color", participant.color);
              dot.textContent = name;
              dot.title = name;
              joinedList.appendChild(dot);
            });
            button.appendChild(joinedList);
          }

          if (dateEvents.length > 1) {
            const more = document.createElement("span");
            more.className = "more-events";
            more.textContent = "+" + (dateEvents.length - 1) + "개 더보기";
            button.appendChild(more);
          }
        }

        button.addEventListener("click", function () {
          selectedKey = key;
          renderCalendar();
          renderEventList();
        });
        calendarGrid.appendChild(button);
      }
    }

    function renderEventList() {
      const dateEvents = Array.isArray(events[selectedKey]) ? events[selectedKey] : [];
      selectedDate.textContent = formatSelectedDate(selectedKey);
      eventList.replaceChildren();

      if (dateEvents.length === 0) {
        const emptyState = document.createElement("div");
        emptyState.className = "empty-state";
        emptyState.innerHTML = '<span class="empty-icon">🏢</span><strong>등록된 기업 탐방이 없어요</strong><p>탐방 추가 버튼을 눌러<br>새 일정을 등록해 보세요.</p>';
        eventList.appendChild(emptyState);
        return;
      }

      dateEvents.forEach(function (event, eventIndex) {
        if (!Array.isArray(event.joined)) event.joined = [];
        const item = document.createElement("article");
        item.className = "event-item";

        const header = document.createElement("div");
        header.className = "event-item-header";

        const title = document.createElement("h3");
        title.textContent = event.company;
        header.appendChild(title);

        const actions = document.createElement("div");
        actions.className = "event-item-actions";

        const editButton = document.createElement("button");
        editButton.className = "icon-button edit-button";
        editButton.setAttribute("aria-label", "수정");
        editButton.textContent = "✎";
        editButton.addEventListener("click", function () {
          openEventForm(eventIndex);
        });
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "icon-button delete-button";
        deleteButton.setAttribute("aria-label", "삭제");
        deleteButton.textContent = "🗑";
        deleteButton.addEventListener("click", function () {
          deleteEvent(eventIndex);
        });
        actions.appendChild(deleteButton);

        header.appendChild(actions);
        item.appendChild(header);

        const information = document.createElement("div");
        information.className = "event-information";
        const time = document.createElement("p");
        time.textContent = "◷ " + event.time;
        const place = document.createElement("p");
        place.textContent = "⌖ " + event.place;
        information.append(time, place);
        item.appendChild(information);

        const participantTitle = document.createElement("p");
        participantTitle.className = "participant-title";
        participantTitle.textContent = "참여할 이름을 눌러주세요";
        item.appendChild(participantTitle);

        const participantList = document.createElement("div");
        participantList.className = "participant-list";
        participants.forEach(function (participant) {
          const button = document.createElement("button");
          const isJoined = event.joined.includes(participant.name);
          button.className = "participant" + (isJoined ? " joined" : "");
          button.style.setProperty("--person-color", participant.color);
          button.textContent = participant.name;
          button.setAttribute("aria-pressed", String(isJoined));
          button.addEventListener("click", function () {
            toggleParticipant(eventIndex, participant.name);
          });
          participantList.appendChild(button);
        });
        item.appendChild(participantList);
        eventList.appendChild(item);
      });
    }

    function toggleParticipant(eventIndex, participantName) {
      const dateEvents = events[selectedKey];
      if (!Array.isArray(dateEvents) || !dateEvents[eventIndex]) return;
      const joined = dateEvents[eventIndex].joined;
      const joinedIndex = joined.indexOf(participantName);
      if (joinedIndex === -1) {
        joined.push(participantName);
        showToast(participantName + "님이 참여했어요");
      } else {
        joined.splice(joinedIndex, 1);
        showToast(participantName + "님의 참여가 취소됐어요");
      }
      renderCalendar();
      renderEventList();
      syncDateKey(selectedKey);
    }

    document.getElementById("previousMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("todayButton").addEventListener("click", function () {
      currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      selectedKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());
      renderCalendar();
      renderEventList();
    });

    function openEventForm(editIndex) {
      const dialogTitleEl = document.getElementById("dialogTitle");
      const submitButton = eventForm.querySelector(".submit-button");
      if (typeof editIndex === "number") {
        editingIndex = editIndex;
        const event = events[selectedKey][editIndex];
        document.getElementById("companyName").value = event.company;
        document.getElementById("eventTime").value = event.time;
        document.getElementById("eventPlace").value = event.place;
        dialogTitleEl.textContent = "탐방 수정";
        submitButton.textContent = "수정하기";
      } else {
        editingIndex = null;
        eventForm.reset();
        dialogTitleEl.textContent = "기업 탐방 추가";
        submitButton.textContent = "캘린더에 추가하기";
      }
      eventDialog.showModal();
      document.getElementById("companyName").focus();
    }

    function deleteEvent(eventIndex) {
      const dateEvents = events[selectedKey];
      if (!Array.isArray(dateEvents) || !dateEvents[eventIndex]) return;
      const company = dateEvents[eventIndex].company;
      if (!window.confirm(company + " 탐방을 삭제할까요?")) return;
      dateEvents.splice(eventIndex, 1);
      renderCalendar();
      renderEventList();
      showToast(company + " 탐방이 삭제됐어요");
      syncDateKey(selectedKey);
    }

    document.getElementById("openEventForm").addEventListener("click", function () {
      openEventForm();
    });

    document.getElementById("closeEventForm").addEventListener("click", function () {
      eventDialog.close();
    });

    eventDialog.addEventListener("click", function (event) {
      if (event.target === eventDialog) eventDialog.close();
    });

    eventForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const formData = new FormData(eventForm);
      const company = formData.get("companyName").trim();
      const time = formData.get("eventTime");
      const place = formData.get("eventPlace").trim();

      if (!company || !time || !place) return;
      if (!Array.isArray(events[selectedKey])) events[selectedKey] = [];

      if (editingIndex !== null && events[selectedKey][editingIndex]) {
        const existing = events[selectedKey][editingIndex];
        existing.company = company;
        existing.time = time;
        existing.place = place;
        showToast(company + " 탐방이 수정됐어요");
      } else {
        events[selectedKey].push({ company: company, time: time, place: place, joined: [] });
        showToast(company + " 탐방이 추가됐어요");
      }

      eventForm.reset();
      editingIndex = null;
      eventDialog.close();
      renderCalendar();
      renderEventList();
      syncDateKey(selectedKey);
    });

    renderCalendar();
    renderEventList();
    setSyncStatus("idle");
    startSync();
  </script>
</body>
</html>
