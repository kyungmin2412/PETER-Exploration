<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페테르 탐방</title>

  <style>
    :root {
      --green: #78b82a;
      --green-dark: #4f8616;
      --green-light: #eff9df;
      --text: #191f28;
      --sub-text: #6b7684;
      --muted: #8b95a1;
      --background: #f6faef;
      --border: #e1ebd5;
      --white: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--background);
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: 70px;
      padding: 0 max(24px, calc((100vw - 1160px) / 2));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(15px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .logo-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
    }

    .main-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      width: min(100% - 40px, 960px);
      margin: 0 auto 80px;
      padding-top: 56px;
    .profile {
      display: grid;
      width: 38px;
      height: 38px;
      margin-left: auto;
      place-items: center;
      border-radius: 50%;
      color: var(--green-dark);
      background: var(--green-light);
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 15px;
      font-weight: 700;
    }

    .main-content {
      display: grid;
      grid-template-columns: minmax(600px, 1.8fr) minmax(320px, 0.9fr);
      gap: 22px;
      max-width: 1160px;
      margin: 0 auto 80px;
      margin: 0 auto 100px;
      padding: 56px 20px 0;
    }

    .calendar-card, .detail-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(55, 86, 18, 0.08);
    }

    .calendar-card { padding: 30px; }

    .calendar-card, .detail-card { min-width: 0; }

    .calendar-header, .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .calendar-header { margin-bottom: 26px; }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .month-navigation h1 {
      min-width: 140px;
      margin: 0;
      font-size: 22px;
      text-align: center;
      letter-spacing: -0.8px;
    }

    .arrow-button {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: #4e5968;
      background: transparent;
      font-size: 25px;
    }

    .arrow-button:hover, .today-button:hover { background: var(--green-light); }

    .today-button {
      padding: 9px 15px;
      border-radius: 10px;
      color: #4e5968;
      background: var(--background);
      font-size: 13px;
      font-weight: 600;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekdays {
      padding-bottom: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-align: center;
    }

    .weekdays span:first-child { color: #f04452; }
    .weekdays span:last-child { color: var(--green-dark); }
    .weekdays span:first-child {
      color: #f04452;
    }

    .weekdays span:last-child {
      color: var(--green);
    }

    .day {
      min-height: 88px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      text-align: left;
      transition: 0.15s;
    }

    .day:not(.empty):hover { background: #f7faF2; }
    .day.selected { border-color: #a9cf75; background: #f4fae9; }
    .day:not(.empty):hover {
      background: #f7f9fa;
    }

    .day.selected {
      border-color: #a9cf75;
      background: #f4fae9;
    }

    .day-number {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      color: #4e5968;
      font-size: 13px;
    }

    .day.sunday .day-number { color: #f04452; }
    .day.saturday .day-number { color: var(--green-dark); }
    .day.today .day-number { color: white; background: var(--green); font-weight: 700; }
    .day.sunday .day-number {
      color: #f04452;
    }

    .day.saturday .day-number {
      color: var(--green-dark);
    }

    .day.today .day-number {
      color: white;
      background: var(--green);
      font-weight: 700;
    }

    .event-chip {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 6px;
      overflow: hidden;
      border-radius: 7px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin: 5px 3px 0;
      overflow: hidden;
    }

    .participant-dot {
      padding: 2px 4px;
      border-radius: 5px;
      color: white;
      background: var(--person-color);
      font-size: 8px;
      font-weight: 800;
    }

    .more-events {
      display: block;
      margin: 4px 0 0 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .detail-card {
      align-self: start;
      min-height: 500px;
      padding: 28px;
    }

    .detail-header {
      align-items: flex-start;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .detail-label { margin: 0 0 7px; color: var(--muted); font-size: 12px; }
    .detail-header h2 { margin: 0; font-size: 21px; letter-spacing: -0.7px; }

    .add-button, .submit-button {
      border-radius: 12px;
      color: white;
      background: var(--green);
    .detail-header h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.7px;
    }

    .weather {
      padding: 7px 10px;
      border-radius: 20px;
      color: #9b6700;
      background: #fff7e8;
      font-size: 11px;
    }

    .event-detail {
      padding-top: 25px;
    }

    .event-type {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 7px;
      color: var(--green-dark);
      background: var(--green-light);
      font-size: 11px;
      font-weight: 700;
    }

    .add-button { flex: none; padding: 10px 13px; font-size: 13px; }
    .add-button:hover, .submit-button:hover { background: var(--green-dark); }

    .event-list { display: grid; gap: 14px; padding-top: 20px; }

    .event-item {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fcfef9;
    }

    .event-item h3 { margin: 0 0 13px; font-size: 19px; letter-spacing: -0.5px; }
    .event-information { display: grid; gap: 7px; color: var(--sub-text); font-size: 13px; }
    .event-information p { margin: 0; }

    .participant-title {
      margin: 18px 0 10px;
      color: var(--sub-text);
      font-size: 12px;
    .face {
      display: grid;
      width: 30px;
      height: 30px;
      margin-left: -7px;
      place-items: center;
      border: 2px solid white;
      border-radius: 50%;
      color: #4e5968;
      background: #e4f3ce;
      font-size: 10px;
      font-weight: 700;
    }

    .participant-list { display: flex; flex-wrap: wrap; gap: 7px; }

    .participant {
      padding: 7px 10px;
      border: 1px solid var(--person-color);
      border-radius: 999px;
      color: var(--person-color);
      background: white;
      font-size: 12px;
    .face:nth-child(4) {
      background: #fef3c7;
    }

    .join-button {
      width: 100%;
      height: 50px;
      border-radius: 13px;
      color: white;
      background: var(--green);
      box-shadow: 0 8px 18px rgba(120, 184, 42, 0.24);
      font-weight: 700;
      transition: 0.15s;
    }

    .participant.joined {
      color: white;
      background: var(--person-color);
      box-shadow: 0 3px 8px color-mix(in srgb, var(--person-color) 28%, transparent);
    .join-button:hover {
      background: var(--green-dark);
    }

    .join-button.joined {
      color: var(--green-dark);
      background: var(--green-light);
      box-shadow: none;
    }

    .empty-state {
      padding: 75px 10px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 60px;
      height: 60px;
      margin: auto;
      place-items: center;
      border-radius: 20px;
      background: var(--background);
      font-size: 27px;
    }

    .empty-state h3 {
      margin: 18px 0 8px;
      font-size: 17px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .guide {
      padding: 90px max(24px, calc((100vw - 1120px) / 2)) 110px;
      background: white;
    }

    .participant.joined::before { content: "✓ "; }

    .empty-state { padding: 65px 10px; color: var(--muted); text-align: center; }
    .empty-icon { display: block; margin-bottom: 14px; font-size: 32px; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.6; }

    dialog {
      width: min(430px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 22px;
      color: var(--text);
      box-shadow: 0 24px 70px rgba(25, 31, 40, 0.22);
    }

    dialog::backdrop { background: rgba(25, 31, 40, 0.45); backdrop-filter: blur(2px); }
    .guide-number {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .dialog-content { padding: 28px; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .dialog-header h2 { margin: 0; font-size: 21px; }
    .close-button { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); background: var(--background); font-size: 20px; }

    .event-form { display: grid; gap: 17px; }
    .form-field { display: grid; gap: 8px; }
    .form-field label { font-size: 13px; font-weight: 700; }
    .form-field input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--border); border-radius: 11px; color: var(--text); outline: none; }
    .form-field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }
    .submit-button { height: 50px; margin-top: 5px; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 30;
      padding: 14px 22px;
      border-radius: 13px;
      color: white;
      background: rgba(25, 31, 40, 0.94);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 15px);
      transition: 0.25s;
      font-size: 13px;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 620px) {
      .header { height: 62px; padding: 0 18px; }
      .main-content { width: calc(100% - 20px); margin-bottom: 60px; padding-top: 28px; }
      .calendar-card { padding: 20px 10px; border-radius: 18px; }
      .calendar-header { padding: 0 8px; }
      .month-navigation { gap: 5px; }
      .month-navigation h1 { min-width: 120px; font-size: 19px; }
      .day { min-width: 0; min-height: 72px; padding: 4px 2px; }
      .event-chip { padding: 4px 3px; font-size: 8px; }
      .calendar-participants { gap: 2px; margin: 3px 1px 0; }
      .participant-dot { padding: 1px 2px; font-size: 7px; }
      .more-events { display: none; }
      .detail-card { padding: 22px; border-radius: 18px; }

    @media (max-width: 850px) {
      .main-content { grid-template-columns: 1fr; }
      .detail-card { min-height: auto; }
    }

    @media (max-width: 620px) {
      .header { height: 62px; padding: 0 18px; }
      .main-content { margin-bottom: 60px; padding: 28px 10px 0; }
      .calendar-card { padding: 20px 10px; border-radius: 18px; }
      .calendar-header { padding: 0 8px; }
      .month-navigation { gap: 5px; }
      .month-navigation h1 { min-width: 120px; font-size: 19px; }
      .day { min-height: 66px; padding: 4px 2px; }
      .event-chip { padding: 4px 3px; font-size: 8px; }
      .more-events { display: none; }
      .detail-card { padding: 22px; border-radius: 18px; }
      .main-content {
        grid-template-columns: 1fr;
      }

      .detail-card {
        min-height: auto;
      }
    }

    @media (max-width: 620px) {
      .header {
        height: 62px;
        padding: 0 18px;
      }

      .main-content {
        padding: 32px 10px 0;
        margin-bottom: 70px;
      }

      .calendar-card {
        padding: 20px 10px;
        border-radius: 18px;
      }

      .calendar-header {
        padding: 0 8px;
      }

      .day {
        min-height: 66px;
        padding: 4px 2px;
      }

      .event-chip {
        padding: 4px 3px;
        font-size: 8px;
      }

      .people-count {
        display: none;
      }

      .detail-card {
        padding: 24px;
        border-radius: 18px;
      }

      .guide {
        padding-top: 70px;
        padding-bottom: 80px;
      }

      .guide-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span>페테르 탐방</span>
    </div>
  </header>

  <main class="main-content">
    <section class="calendar-card" aria-label="기업 탐방 캘린더">
      <div class="calendar-header">
        <div class="month-navigation">
          <button id="previousMonth" class="arrow-button" aria-label="이전 달">‹</button>
          <h1 id="monthTitle"></h1>
          <button id="nextMonth" class="arrow-button" aria-label="다음 달">›</button>
        </div>
        <button id="todayButton" class="today-button">오늘</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="detail-card" aria-live="polite" aria-label="탐방 일정과 참여자">
    <aside class="detail-card" aria-live="polite">
      <div class="detail-header">
        <div>
          <p class="detail-label">선택한 날짜</p>
          <h2 id="selectedDate"></h2>
  <main>
    <section class="main-content">
      <div class="calendar-card">
        <div class="calendar-header">
          <div class="month-navigation">
            <button id="previousMonth" class="arrow-button" aria-label="이전 달">
              ‹
            </button>

            <h2 id="monthTitle"></h2>

            <button id="nextMonth" class="arrow-button" aria-label="다음 달">
              ›
            </button>
          </div>

          <button id="todayButton" class="today-button">
            오늘
          </button>
        </div>

        <div class="weekdays">
          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
        </div>
        <button id="openEventForm" class="add-button">+ 탐방 추가</button>
      </div>
      <div id="eventList" class="event-list"></div>
    </section>
    </aside>
  </main>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 id="dialogTitle">기업 탐방 추가</h2>
        <button id="closeEventForm" class="close-button" aria-label="닫기">×</button>
      </div>
      <form id="eventForm" class="event-form">
        <div class="form-field">
          <label for="companyName">기업명</label>
          <input id="companyName" name="companyName" type="text" maxlength="50" placeholder="기업명을 입력하세요" required>
        </div>
        <div class="form-field">
          <label for="eventTime">시간</label>
          <input id="eventTime" name="eventTime" type="text" maxlength="30" placeholder="예: 오후 2시 30분" required>
          <input id="eventTime" name="eventTime" type="time" required>
        </div>
        <div class="form-field">
          <label for="eventPlace">장소</label>
          <input id="eventPlace" name="eventPlace" type="text" maxlength="100" placeholder="방문 장소를 입력하세요" required>
        </div>
        <button class="submit-button" type="submit">캘린더에 추가하기</button>
      </form>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const participants = [
      { name: "장원", color: "#e05d5d" },
      { name: "현규", color: "#dc8b21" },
      { name: "남훈", color: "#b69b13" },
      { name: "상현", color: "#58a537" },
      { name: "학민", color: "#239b83" },
      { name: "두영", color: "#397fc4" },
      { name: "경민", color: "#7559c8" },
      { name: "재현", color: "#c05298" }
    ];

    const today = new Date();
    let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());
    let events = loadEvents();
    let toastTimer;

    const calendarGrid = document.getElementById("calendarGrid");
    const monthTitle = document.getElementById("monthTitle");
    const selectedDate = document.getElementById("selectedDate");
    const eventList = document.getElementById("eventList");
    const eventDialog = document.getElementById("eventDialog");
    const eventForm = document.getElementById("eventForm");

    function makeDateKey(year, month, day) {
      return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function loadEvents() {
      try {
        const savedEvents = JSON.parse(localStorage.getItem("companyExplorations") || "{}");
        return savedEvents && typeof savedEvents === "object" ? savedEvents : {};
      } catch (error) {
        return {};
      }
    }

    function saveEvents() {
      localStorage.setItem("companyExplorations", JSON.stringify(events));
    }

    function formatSelectedDate(key) {
      const [year, month, day] = key.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      return month + "월 " + day + "일 " + weekdays[date.getDay()] + "요일";
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const todayKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());

      monthTitle.textContent = year + "년 " + (month + 1) + "월";
      calendarGrid.replaceChildren();

      for (let index = 0; index < firstWeekday; index += 1) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day empty";
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day += 1) {
        const key = makeDateKey(year, month, day);
        const dateEvents = Array.isArray(events[key]) ? events[key] : [];
        const weekday = new Date(year, month, day).getDay();
        const button = document.createElement("button");
        button.className = "day";
        button.setAttribute("aria-label", (month + 1) + "월 " + day + "일, 탐방 " + dateEvents.length + "개");

        if (weekday === 0) button.classList.add("sunday");
        if (weekday === 6) button.classList.add("saturday");
        if (key === selectedKey) button.classList.add("selected");
        if (key === todayKey) button.classList.add("today");

        const dayNumber = document.createElement("span");
        dayNumber.className = "day-number";
        dayNumber.textContent = day;
        button.appendChild(dayNumber);

        if (dateEvents.length > 0) {
          const chip = document.createElement("span");
          chip.className = "event-chip";
          chip.textContent = dateEvents[0].company;
          button.appendChild(chip);

          const joinedNames = Array.from(new Set(dateEvents.flatMap(function (dateEvent) {
            return Array.isArray(dateEvent.joined) ? dateEvent.joined : [];
          })));
          if (joinedNames.length > 0) {
            const joinedList = document.createElement("span");
            joinedList.className = "calendar-participants";
            joinedList.setAttribute("aria-label", "참여자: " + joinedNames.join(", "));
            joinedNames.forEach(function (name) {
              const participant = participants.find(function (person) { return person.name === name; });
              if (!participant) return;
              const dot = document.createElement("span");
              dot.className = "participant-dot";
              dot.style.setProperty("--person-color", participant.color);
              dot.textContent = name;
              dot.title = name;
              joinedList.appendChild(dot);
            });
            button.appendChild(joinedList);
          }

          if (dateEvents.length > 1) {
            const more = document.createElement("span");
            more.className = "more-events";
            more.textContent = "+" + (dateEvents.length - 1) + "개 더보기";
            button.appendChild(more);
          }
        }

        button.addEventListener("click", function () {
          selectedKey = key;
          renderCalendar();
          renderEventList();
        });
        calendarGrid.appendChild(button);
      }
    }

    function renderEventList() {
      const dateEvents = Array.isArray(events[selectedKey]) ? events[selectedKey] : [];
      selectedDate.textContent = formatSelectedDate(selectedKey);
      eventList.replaceChildren();

      if (dateEvents.length === 0) {
        const emptyState = document.createElement("div");
        emptyState.className = "empty-state";
        emptyState.innerHTML = '<span class="empty-icon">🏢</span><strong>등록된 기업 탐방이 없어요</strong><p>탐방 추가 버튼을 눌러<br>새 일정을 등록해 보세요.</p>';
        eventList.appendChild(emptyState);
        return;
      }

      dateEvents.forEach(function (event, eventIndex) {
        if (!Array.isArray(event.joined)) event.joined = [];
        const item = document.createElement("article");
        item.className = "event-item";

        const title = document.createElement("h3");
        title.textContent = event.company;
        item.appendChild(title);

        const information = document.createElement("div");
        information.className = "event-information";
        const time = document.createElement("p");
        time.textContent = "◷ " + event.time;
        information.appendChild(time);
        const place = document.createElement("p");
        place.textContent = "⌖ " + event.place;
        information.append(time, place);
        item.appendChild(information);

        const participantTitle = document.createElement("p");
        participantTitle.className = "participant-title";
        participantTitle.textContent = "참여할 이름을 눌러주세요";
        item.appendChild(participantTitle);

        const participantList = document.createElement("div");
        participantList.className = "participant-list";
        participants.forEach(function (participant) {
          const button = document.createElement("button");
          const isJoined = event.joined.includes(participant.name);
          button.className = "participant" + (isJoined ? " joined" : "");
          button.style.setProperty("--person-color", participant.color);
          button.textContent = participant.name;
          button.setAttribute("aria-pressed", String(isJoined));
          button.addEventListener("click", function () {
            toggleParticipant(eventIndex, participant.name);
          });
          participantList.appendChild(button);
        });
        item.appendChild(participantList);
        eventList.appendChild(item);
      });
    }

    function toggleParticipant(eventIndex, participantName) {
      const joined = events[selectedKey][eventIndex].joined;
      const joinedIndex = joined.indexOf(participantName);
      if (joinedIndex === -1) {
        joined.push(participantName);
        showToast(participantName + "님이 참여했어요");
      } else {
        joined.splice(joinedIndex, 1);
        showToast(participantName + "님의 참여가 취소됐어요");
      }
      saveEvents();
      renderCalendar();
      renderEventList();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    document.getElementById("previousMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", function () {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("todayButton").addEventListener("click", function () {
      currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      selectedKey = makeDateKey(today.getFullYear(), today.getMonth(), today.getDate());
      renderCalendar();
      renderEventList();
    });

    document.getElementById("openEventForm").addEventListener("click", function () {
      eventDialog.showModal();
      document.getElementById("companyName").focus();
    });

    document.getElementById("closeEventForm").addEventListener("click", function () {
      eventDialog.close();
    });

    eventDialog.addEventListener("click", function (event) {
      if (event.target === eventDialog) eventDialog.close();
    });

    eventForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const formData = new FormData(eventForm);
      const newEvent = {
        company: formData.get("companyName").trim(),
        time: formData.get("eventTime"),
        joined: []
      };

      if (!newEvent.company || !newEvent.time.trim()) return;
        place: formData.get("eventPlace").trim(),
        joined: []
      };

      if (!newEvent.company || !newEvent.time || !newEvent.place) return;
      if (!Array.isArray(events[selectedKey])) events[selectedKey] = [];
      events[selectedKey].push(newEvent);
      saveEvents();
      eventForm.reset();
      eventDialog.close();
      renderCalendar();
      renderEventList();
      showToast(newEvent.company + " 탐방이 추가됐어요");
    });

    renderCalendar();
    renderEventList();
  </script>
</body>
</html>
